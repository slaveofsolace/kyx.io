name: Manual static build verification

# Historical filename retained to avoid an unreviewed file deletion. This
# workflow does not deploy, connect to a VPS, consume deployment secrets, or
# configure the legacy relay. Production deployment must be added only after
# the release gates pass and the user explicitly authorizes it.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-static-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
