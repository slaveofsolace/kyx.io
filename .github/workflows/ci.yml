name: Repository verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: true
      GIT_LFS_SKIP_SMUDGE: 1

    steps:
      - uses: actions/checkout@v4

      - name: Hydrate runtime-critical LFS fixtures
        run: |
          git lfs install --local
          git lfs pull --include="assets/review/runtime-candidates/g6-rev30-cc0-donor/character-lod0.glb,assets/source/maps/inkfall-foundry/export/*.glb,assets/source/maps/inkfall-foundry/revisions/revision-2/export/*.glb,assets/source/maps/inkfall-foundry/revisions/revision-2/source/inkfall_foundry.blend,assets/source/maps/inkfall-foundry/revisions/revision-3/export/*.glb,assets/source/maps/inkfall-foundry/art-kit/press-archive-rev5/rev5/export/*.glb" --exclude=""

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@11.18.0

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck Worker
        run: npm run typecheck:worker

      - name: Typecheck Pages staging proxy
        run: npm run typecheck:pages

      - name: Typecheck deterministic simulation
        run: npm run typecheck:sim

      - name: Lint
        run: npm run lint

      - name: Test application
        run: npm run test

      - name: Test routine Worker suite
        run: npm run test:worker

      - name: Build production package
        run: npm run build

      - name: Validate release assets
        run: npm run validate:assets:release

      - name: Verify release provenance
        run: npm run verify:release-provenance

      - name: Verify package closure
        run: npm run verify:release-package

      - name: Audit release readiness
        run: npm run audit:g9
