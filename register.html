<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KYX.IO &mdash; Local Guest Profile</title>
</head>
<body>
  <div class="auth-page">
    <header class="login-topbar">
      <a class="login-brand" href="/">KYX<span>.IO</span></a>
      <nav class="login-nav" aria-label="Primary">
        <a class="login-nav-link" href="/">Offline practice</a>
        <a class="login-nav-link active" href="/login">Local profile</a>
      </nav>
    </header>

    <main class="login-main">
      <h1 class="login-title">Local Guest Profile</h1>

      <div class="login-forms">
        <form id="local-profile-form" class="auth-form" novalidate>
          <label class="login-label" for="profile-name">Display name <span class="req" aria-hidden="true">*</span></label>
          <input
            id="profile-name"
            class="login-input"
            autocomplete="nickname"
            minlength="2"
            maxlength="24"
            aria-describedby="profile-hint profile-error"
            required
            autofocus
          />
          <div id="profile-hint" class="login-hint">
            Stored only in this browser. A display name is not an online account or verified identity.
          </div>
          <div id="profile-error" class="auth-error hidden" role="alert" aria-live="polite"></div>
          <button id="profile-submit" class="login-submit" type="submit">
            <span class="login-ico" aria-hidden="true">&#8677;</span> Save local profile &amp; play
          </button>
        </form>
      </div>

      <div class="login-alt">
        <a href="/" class="login-link">Return to Offline Practice</a>
      </div>
    </main>
  </div>
  <script type="module" src="/src/registerPage.js"></script>
</body>
</html>
